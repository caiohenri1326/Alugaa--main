<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alugaê</title>
    <link rel="stylesheet" href="../page-alugar-produto/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar container-header">
        <div class="container-fluid">
            <a class="navbar-brand">Alugaê</a>
            <form class="form-header" role="search">
                <input class="form-control" type="search" placeholder="Buscar anúncios..." aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
                <div class="buttons-interact">
                    <button class="icon-notifications"><i class="bi bi-bell"></i></button>
                    <button class="icon-chat"><i class="bi bi-chat"></i></button>
                    <button class="icon-favorites"><i class="bi bi-heart"></i></button>
                </div>
                
            </form>
            <div class="container-login">
                <div class="dropdown">
                    <img src="../../assets/eu.jpg" alt="Perfil" class="rounded-circle dropdown-toggle" id="menuPerfil" data-bs-toggle="dropdown" aria-expanded="false" style="width: 40px; height: 40px; cursor: pointer;">
                    <ul class="dropdown-menu shadow" aria-labelledby="menuPerfil">
                        <li>
                            <p>Olá, <span>Caio</span></p>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a href="" class="dropdown-item"><i class="bi bi-bag"></i>Meus Anuncios</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person-fill-gear"></i>Editar Perfil</a></li>
                        <li><a class="dropdown-item" href="/front-end/config/index.html"><i class="bi bi-gear"></i>Configurações</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger area-sair" href="../login-page/index.html"><i class="bi bi-person-up"></i>Sair</a></li>
                    </ul>
                    </div>

                <button class="btn-anunciar"><i class="bi bi-bag-plus"></i>Anunciar</button>
            </div>
        </div>
    </nav>
<script>
    window.onload = function() {
    // Recupera valor salvo no localStorage
    const corSelecionada = localStorage.getItem('temaCustomizado');
    root.style.setProperty('--cor-destaque', corSelecionada);


    const temaSalvo = localStorage.getItem('modoTema')

    if(temaSalvo === 'escuro'){
        root.style.setProperty('--bg-site', '#1C1C1D');
        root.style.setProperty('--colorText', '#252728');
        root.style.setProperty('--fundo-de-abas', '#252728');
        root.style.setProperty('--colorTextCinza', '#A0A0A0');
        root.style.setProperty('--textoPreto', 'rgba(0, 0, 0, 0.631)');
        root.style.colorScheme = 'dark';
    }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</body>
</html>

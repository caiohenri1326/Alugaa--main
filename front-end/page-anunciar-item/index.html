<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anúnciar um item</title>

    <link rel="icon" href="../../assets/LOGO_ALUGAÊ-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="./../page-anunciar-item/script.js" defer></script>
</head>

<body>
    <div class="container-anuncio">

        <!-- 🔙 VOLTAR -->
        <a href="../homepage/index.html">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>

        <div class="text-header">
            <h6>Publicar um Anúncio</h6>
            <p>Preencha os dados abaixo com o máximo de detalhes possível</p>
        </div>

        <!-- 🚀 FORM -->
        <form class="form-anuncio" enctype="multipart/form-data">

            <p>Fotos do Produto</p>

            <div class="container-upload">
                <label for="foto" class="upload-placeholder">
                    <i class="bi bi-image icon-upload"></i>
                    <span class="text-upload">Adicionar Foto</span>
                </label>

                <input type="file" id="foto" name="foto" accept="image/*" class="hide-input">
            </div>

            <div class="nome-do-anuncio">
                <label>Título do Anúncio</label>
                <input type="text" class="input-titulo" name="titulo" placeholder="Ex: PlayStation 5 Pro">
            </div>

            <!-- 🎯 SELECT -->
            <div class="select-custom">
                <div class="select-selected">
                    Categorias <i class="bi bi-arrow-down"></i>
                </div>

                <ul class="select-options">
                    <li data-value="5">Roupas</li>
                    <li data-value="6">Esportes</li>
                    <li data-value="7">Autos</li>
                    <li data-value="8">Video Games</li>
                    <li data-value="9">Imóveis</li>
                    <li data-value="10">Tecnologias</li>    
                </ul>

                <input type="hidden" name="categoria">
            </div>

            <label>Preço (R$)</label>
            <input type="text" class="input-preco" name="preco" placeholder="0,00">

            <label>Descrição</label>
            <input class="area-caracteristicas" type="text" name="descricao" placeholder="Descreva o produto...">

            <div class="container-infos">
                <label>Informe o CEP</label>
                <input type="text" id="cep"  maxlength="9" placeholder="00000-000">
            </div>

        <div id="endereco" class="cep-box hidden">
                <i class="bi bi-geo-alt-fill"></i>
            <div class="cep-info">
            <span class="cep-main"></span>
            <small class="cep-sub"></small>
        </div>
    </div>

            <div class="buttons-enter">
                <button type="button" class="button-cancel">Cancelar</button>
                <button type="submit" class="button-anunciar">Anunciar</button>
            </div>

        </form>
    </div>
</body>
</html>

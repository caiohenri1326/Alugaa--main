<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anúnciar um item</title>

    <link rel="icon" href="../../assets/LOGO_ALUGAÊ-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="./../page-anunciar-item/script.js" defer></script>
</head>

<body>
    <div class="container-anuncio">

        <!-- 🔙 VOLTAR -->
        <a href="../homepage/index.html"><i class="bi bi-arrow-left"></i> Voltar</a>

        <div class="text-header">
            <h6>Publicar um Anúncio</h6>
            <p>Preencha os dados abaixo com o máximo de detalhes possível para atrair mais compradores</p>
        </div>

        <!-- 🚀 FORM -->
        <form class="form-anuncio" enctype="multipart/form-data">

            <p>Fotos do Produto</p>

            <div class="container-upload">
                <label for="foto" class="upload-placeholder">
                    <i class="bi bi-image icon-upload"></i>
                    <span class="text-upload">Adicionar Foto</span>
                </label>

                <!-- ✅ IMPORTANTE -->
                <input type="file" id="foto" name="foto" accept="image/*" class="hide-input">
            </div>

            <div class="nome-do-anuncio">
                <label class="titulo-anuncio">Título do Anúncio</label>
                <p>0/100</p>

                <!-- ✅ NAME ADICIONADO -->
                <input type="text" class="input-titulo" name="titulo" placeholder="Ex: PlayStation 5 Pro">
            </div>

            <!-- 🎯 SELECT -->
            <div class="select-custom">
                <div class="select-selected">Categorias <i class="bi bi-arrow-down"></i></div>

                <ul class="select-options">
                    <li data-value="5">Roupas</li>
                    <li data-value="6">Esportes</li>
                    <li data-value="7">Autos</li>
                    <li data-value="8">Video Games</li>
                    <li data-value="9">Imoveis</li>
                    <li data-value="10">Tecnologias</li>    
                </ul>

                <!-- ✅ NAME ADICIONADO -->
                <input type="hidden" name="categoria">
            </div>

            <label class="preco">Preço (R$)</label>

            <!-- ✅ NAME -->
            <input type="text" class="input-preco" name="preco" placeholder="0,00">

            <label class="descricao">Descrição</label>

            <!-- ✅ NAME -->
            <input class="area-caracteristicas" type="text" name="descricao" placeholder="Descreva as características...">

            <div class="container-infos">

                <div class="container-localization">
                    <label>Localização / Cidade</label>

                    <!-- ✅ NAME -->
                    <input type="text" class="input-localization" name="cidade" placeholder="Ex: São Paulo, SP">
                </div>

                <div class="container-contato">
                    <label>Telefone para Contato</label>

                    <!-- ✅ NAME -->
                    <input type="text" name="telefone" placeholder="(00) 00000-0000">
                </div>

            </div>

            <div class="buttons-enter">
                <button type="button" class="button-cancel">Cancelar</button>
                <button type="submit" class="button-anunciar">Anunciar</button>
            </div>

        </form>
    </div>
</body>
</html>
